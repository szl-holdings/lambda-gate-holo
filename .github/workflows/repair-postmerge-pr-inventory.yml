name: Repair bounded post-merge PR inventory

on:
  push:
    branches:
      - fix/postmerge-pr-inventory-20260828

permissions:
  contents: write

concurrency:
  group: repair-postmerge-pr-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact source and test repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/hf_static_space.py')
          source = source_path.read_text(encoding='utf-8')
          if 'def _select_exact_merged_pull(' in source:
              raise SystemExit('post-merge inventory helper already exists')

          anchor = '\n\ndef _require_latest_run_still_exact('
          if source.count(anchor) != 1:
              raise SystemExit('exact helper insertion anchor not found once')

          helpers = r'''

          def _merged_pull_candidate_is_exact(
              row: object,
              repository: str,
              repository_id: int,
              before_sha: str,
              source_sha: str,
          ) -> bool:
              head = row.get("head") if isinstance(row, dict) else None
              base = row.get("base") if isinstance(row, dict) else None
              head_repository = head.get("repo") if isinstance(head, dict) else None
              base_repository = base.get("repo") if isinstance(base, dict) else None
              head_sha = str((head or {}).get("sha") or "").lower()
              head_ref = (head or {}).get("ref")
              return (
                  isinstance(row, dict)
                  and type(row.get("id")) is int
                  and row["id"] > 0
                  and type(row.get("number")) is int
                  and row["number"] > 0
                  and row.get("state") == "closed"
                  and isinstance(row.get("merged_at"), str)
                  and bool(row["merged_at"])
                  and row.get("merge_commit_sha") == source_sha
                  and isinstance(base, dict)
                  and base.get("ref") == "main"
                  and base.get("sha") == before_sha
                  and isinstance(base_repository, dict)
                  and base_repository.get("full_name") == repository
                  and base_repository.get("id") == repository_id
                  and isinstance(head, dict)
                  and isinstance(head_ref, str)
                  and bool(head_ref)
                  and HEX40.fullmatch(head_sha) is not None
                  and isinstance(head_repository, dict)
                  and head_repository.get("full_name") == repository
                  and head_repository.get("id") == repository_id
              )


          def _select_exact_merged_pull(
              rows: list[dict],
              repository: str,
              repository_id: int,
              before_sha: str,
              source_sha: str,
          ) -> dict:
              matches = [
                  row
                  for row in rows
                  if _merged_pull_candidate_is_exact(
                      row,
                      repository,
                      repository_id,
                      before_sha,
                      source_sha,
                  )
              ]
              if len(matches) != 1:
                  raise ContractError(
                      "exact main revision is not one unambiguous merged PR"
                  )
              return matches[0]
          '''
          source = source.replace(anchor, helpers + anchor, 1)

          old = r'''        associated_url = (
                      f"{api_root}/repos/{repository}/commits/{source_sha}/pulls"
                  )
                  associated = _complete_list_inventory(
                      associated_url, token, "associated pull-request"
                  )
                  candidates = [
                      row
                      for row in associated
                      if isinstance(row, dict)
                      and row.get("state") == "closed"
                      and row.get("merged_at")
                      and row.get("merge_commit_sha") == source_sha
                      and isinstance(row.get("base"), dict)
                      and row["base"].get("ref") == "main"
                      and row["base"].get("sha") == before_sha
                      and isinstance(row["base"].get("repo"), dict)
                      and row["base"]["repo"].get("full_name") == repository
                  ]
                  if len(candidates) != 1:
                      raise ContractError("exact main revision is not one unambiguous merged PR")
                  candidate = candidates[0]
          '''
          new = r'''        pull_inventory_query = urllib.parse.urlencode(
                      {
                          "state": "closed",
                          "base": "main",
                          "sort": "updated",
                          "direction": "desc",
                      }
                  )
                  associated_url = (
                      f"{api_root}/repos/{repository}/pulls?{pull_inventory_query}"
                  )
                  associated = _complete_list_inventory(
                      associated_url, token, "closed main pull-request"
                  )
                  candidate = _select_exact_merged_pull(
                      associated,
                      repository,
                      expected_repository_id,
                      before_sha,
                      source_sha,
                  )
          '''
          if source.count(old) != 1:
              raise SystemExit('exact governed-main association block not found once')
          source = source.replace(old, new, 1)
          source = source.replace(
              'token, "final associated pull-request"',
              'token, "final closed main pull-request"',
              1,
          )
          source = source.replace(
              '"associated pull-request inventory changed during authorization"',
              '"closed main pull-request inventory changed during authorization"',
              1,
          )
          source_path.write_text(source, encoding='utf-8')

          tests_path = Path('tests/test_hf_static_space.py')
          tests = tests_path.read_text(encoding='utf-8')
          old_test = r'''        if path == f"/repos/{repository}/commits/{SOURCE_SHA}/pulls":
                      page = int(query.get("page", ["1"])[0])
          '''
          new_test = r'''        if path == f"/repos/{repository}/pulls":
                      expected_inventory_query = {
                          "state": ["closed"],
                          "base": ["main"],
                          "sort": ["updated"],
                          "direction": ["desc"],
                          "per_page": [str(MODULE.GITHUB_PER_PAGE)],
                      }
                      for key, value in expected_inventory_query.items():
                          if query.get(key) != value:
                              raise AssertionError(
                                  f"guard omitted exact closed-PR inventory query {key}"
                              )
                      page = int(query.get("page", ["1"])[0])
          '''
          if tests.count(old_test) != 1:
              raise SystemExit('exact guard responder association branch not found once')
          tests_path.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8')

          new_tests = r'''from __future__ import annotations

          import copy
          import importlib.util
          from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[1]
          SCRIPT = ROOT / "scripts" / "hf_static_space.py"
          SPEC = importlib.util.spec_from_file_location("hf_static_space_inventory", SCRIPT)
          assert SPEC and SPEC.loader
          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)

          REPOSITORY = MODULE.load_config()["source_repository"]
          REPOSITORY_ID = MODULE.TARGET_REPOSITORY_IDS[REPOSITORY]
          BEFORE = "b" * 40
          SOURCE = "a" * 40
          HEAD = "d" * 40


          def exact_row(*, row_id: int = 70, number: int = 7) -> dict:
              return {
                  "id": row_id,
                  "number": number,
                  "state": "closed",
                  "merged_at": "2026-08-28T15:00:00Z",
                  "merge_commit_sha": SOURCE,
                  "base": {
                      "ref": "main",
                      "sha": BEFORE,
                      "repo": {"full_name": REPOSITORY, "id": REPOSITORY_ID},
                  },
                  "head": {
                      "ref": "release-candidate",
                      "sha": HEAD,
                      "repo": {"full_name": REPOSITORY, "id": REPOSITORY_ID},
                  },
              }


          class PostMergePullInventoryTests(unittest.TestCase):
              def select(self, rows: list[dict]) -> dict:
                  return MODULE._select_exact_merged_pull(
                      rows, REPOSITORY, REPOSITORY_ID, BEFORE, SOURCE
                  )

              def test_exact_singleton_survives_unrelated_closed_rows(self) -> None:
                  older = exact_row(row_id=60, number=6)
                  older["merge_commit_sha"] = "c" * 40
                  newer = exact_row(row_id=80, number=8)
                  newer["base"]["sha"] = "e" * 40
                  selected = self.select([newer, exact_row(), older])
                  self.assertEqual(selected["id"], 70)

              def test_two_exact_rows_fail_ambiguously(self) -> None:
                  with self.assertRaisesRegex(MODULE.ContractError, "unambiguous"):
                      self.select([exact_row(), exact_row(row_id=71, number=8)])

              def test_no_exact_row_fails_closed(self) -> None:
                  row = exact_row()
                  row["merge_commit_sha"] = "c" * 40
                  with self.assertRaisesRegex(MODULE.ContractError, "unambiguous"):
                      self.select([row])

              def test_every_governed_tuple_field_is_required(self) -> None:
                  mutations = {
                      "state": lambda row: row.__setitem__("state", "open"),
                      "merged_at": lambda row: row.__setitem__("merged_at", None),
                      "merge_sha": lambda row: row.__setitem__("merge_commit_sha", "c" * 40),
                      "base_ref": lambda row: row["base"].__setitem__("ref", "dev"),
                      "base_sha": lambda row: row["base"].__setitem__("sha", "c" * 40),
                      "base_name": lambda row: row["base"]["repo"].__setitem__(
                          "full_name", "foreign/repository"
                      ),
                      "base_id": lambda row: row["base"]["repo"].__setitem__(
                          "id", REPOSITORY_ID + 1
                      ),
                      "head_ref": lambda row: row["head"].__setitem__("ref", ""),
                      "head_sha": lambda row: row["head"].__setitem__("sha", "bad"),
                      "head_name": lambda row: row["head"]["repo"].__setitem__(
                          "full_name", "foreign/repository"
                      ),
                      "head_id": lambda row: row["head"]["repo"].__setitem__(
                          "id", REPOSITORY_ID + 1
                      ),
                      "head_repo": lambda row: row["head"].__setitem__("repo", None),
                  }
                  for label, mutate in mutations.items():
                      with self.subTest(label=label):
                          row = copy.deepcopy(exact_row())
                          mutate(row)
                          with self.assertRaises(MODULE.ContractError):
                              self.select([row])

              def test_old_merge_commit_association_is_not_an_authority_input(self) -> None:
                  source = SCRIPT.read_text(encoding="utf-8")
                  self.assertNotIn('commits/{source_sha}/pulls', source)
                  self.assertIn('"state": "closed"', source)
                  self.assertIn('"base": "main"', source)
                  self.assertIn('"direction": "desc"', source)


          if __name__ == "__main__":
              unittest.main()
          '''
          Path('tests/test_postmerge_pr_inventory.py').write_text(
              new_tests.lstrip(), encoding='utf-8'
          )
          Path('tasks/HF_STATIC_SPACE_POSTMERGE_AUTHORITY_20260828.md').unlink()
          PY

      - name: Run exact validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/hf-validator.lock
          python -m py_compile scripts/hf_static_space.py tests/test_hf_static_space.py tests/test_postmerge_pr_inventory.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit and push the repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git add scripts/hf_static_space.py tests/test_hf_static_space.py tests/test_postmerge_pr_inventory.py tasks/HF_STATIC_SPACE_POSTMERGE_AUTHORITY_20260828.md
          git diff --cached --check
          git commit -F - <<'EOF'
          fix(release): bind post-merge PR inventory exactly

          Replace the unstable merge-commit association projection with a
          bounded complete closed-main PR inventory keyed to the exact squash
          revision, push parent, repository identity, and candidate head.

          Preserve full PR readback, exact head association, workflow attempts,
          check suites, DCO, body evidence, and final inventory equality. Add
          adversarial singleton, ambiguity, unrelated-row, malformed-tuple, and
          authority-input coverage.

          Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>
          EOF
          git push origin "HEAD:${GITHUB_REF_NAME}"
