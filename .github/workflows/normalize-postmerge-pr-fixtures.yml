name: Normalize post-merge PR fixtures

on:
  push:
    branches:
      - fix/postmerge-pr-inventory-20260828

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize complete merge tuples
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_hf_static_space.py')
          text = path.read_text(encoding='utf-8')
          old = '''        candidate = {
                      "id": 70,
                      "number": 7,
                      "state": "closed",
                      "merged_at": "2026-08-10T00:00:00Z",
                      "merge_commit_sha": SOURCE_SHA,
                      "base": {
                          "ref": "main",
                          "sha": PARENT_SHA,
                          "repo": {"full_name": repository},
                      },
                  }
          '''
          if text.count(old) != 2:
              raise SystemExit(f'expected two legacy candidate fixtures, found {text.count(old)}')
          text = text.replace(old, '        candidate = exact_merged_pull(repository)\n', 2)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit normalized fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git add tests/test_hf_static_space.py
          git commit -F - <<'EOF'
          test(release): bind pagination fixtures to exact tuples

          Use the complete governed merged-PR fixture so pagination and drift
          tests reach their intended assertions under the stricter selector.

          Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>
          EOF
          git push origin "HEAD:${GITHUB_REF_NAME}"
